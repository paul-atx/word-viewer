name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Toolchain
        run: |
          rustup update stable
          rustup default stable
          rustup component add clippy
      - name: Lint
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: Test (includes malicious-input tests)
        run: cargo test --release --locked
      - name: Build
        run: cargo build --release --locked
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: word-viewer
          path: target/release/word-viewer.exe
          if-no-files-found: error

  imports:
    # The exe may only import DLLs Windows always loads from System32 (KnownDLLs
    # and API sets), so nothing placed next to it can be loaded instead.
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: word-viewer
      - name: Check DLL imports
        run: |
          objdump -p word-viewer.exe | awk '/DLL Name:/ {print $3}' | tee imports.txt
          bad=$(grep -viE '^(kernel32|user32|shell32|comdlg32|ntdll)\.dll$|^api-ms-win-' imports.txt || true)
          if [ -n "$bad" ]; then echo "::error::DLL imports that could be planted: $bad"; exit 1; fi

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, imports]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: word-viewer
      - name: Checksum
        run: sha256sum word-viewer.exe > word-viewer.exe.sha256
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: word-viewer.exe
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "$GITHUB_REF_NAME" word-viewer.exe word-viewer.exe.sha256
          --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes
